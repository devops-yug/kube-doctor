apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kube-doctor.fullname" . }}-gitops-oauth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-doctor.labels" . | nindent 4 }}
type: Opaque
stringData:
  GITHUB_OAUTH_CLIENT_ID: {{ .Values.gitops.github.clientId | quote }}
  GITHUB_OAUTH_CLIENT_SECRET: {{ .Values.gitops.github.clientSecret | quote }}
  GITHUB_OAUTH_TOKEN: {{ .Values.gitops.github.oauthToken | quote }}
  GITLAB_OAUTH_CLIENT_ID: {{ .Values.gitops.gitlab.clientId | quote }}
  GITLAB_OAUTH_CLIENT_SECRET: {{ .Values.gitops.gitlab.clientSecret | quote }}
  GITLAB_OAUTH_TOKEN: {{ .Values.gitops.gitlab.oauthToken | quote }}
