apiVersion: v1
kind: Service
metadata:
  name: {{ include "kube-doctor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: {{ include "kube-doctor.fullname" . }}-serving-cert
  labels:
    {{- include "kube-doctor.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.tlsPort | default 9443 }}
      targetPort: https
      protocol: TCP
      name: https
  selector:
    {{- include "kube-doctor.selectorLabels" . | nindent 4 }}
