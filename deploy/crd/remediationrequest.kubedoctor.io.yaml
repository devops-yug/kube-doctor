apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: remediationrequests.kubedoctor.io
spec:
  group: kubedoctor.io
  names:
    kind: RemediationRequest
    listKind: RemediationRequestList
    plural: remediationrequests
    singular: remediationrequest
    shortNames:
      - remreq
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Issue
          type: string
          jsonPath: .spec.issueType
        - name: Criticality
          type: string
          jsonPath: .spec.criticality
        - name: Severity
          type: string
          jsonPath: .spec.severity
        - name: Mode
          type: string
          jsonPath: .spec.approvalMode
        - name: Approved
          type: boolean
          jsonPath: .spec.approved
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: GitOps PR
          type: string
          jsonPath: .spec.gitOpsPullRequest.url
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                issueType:
                  type: string
                criticality:
                  type: string
                severity:
                  type: string
                reason:
                  type: string
                approvalMode:
                  type: string
                  enum: ["IN_CLUSTER", "GITHUB_PR", "GITLAB_MR", "HYBRID"]
                inClusterAllowed:
                  type: boolean
                approved:
                  type: boolean
                  description: "Set to true in-cluster or via the OpenShift Console UI Plugin to approve and execute the remediation immediately."
                gitOpsPullRequest:
                  type: object
                  properties:
                    provider:
                      type: string
                    url:
                      type: string
                    branch:
                      type: string
                    filePath:
                      type: string
                targetResource:
                  type: object
                  properties:
                    apiVersion:
                      type: string
                    kind:
                      type: string
                    namespace:
                      type: string
                    name:
                      type: string
                operation:
                  type: string
                patchPayload:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                approvedBy:
                  type: string
                executedAt:
                  type: string
