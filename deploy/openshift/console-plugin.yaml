apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-doctor-console-plugin
  namespace: kube-doctor-system
  labels:
    app: kube-doctor-console-plugin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-doctor-console-plugin
  template:
    metadata:
      labels:
        app: kube-doctor-console-plugin
    spec:
      containers:
        - name: console-plugin
          image: ghcr.io/luigi/kube-doctor-console-plugin:v1.35-ocp4.22
          ports:
            - containerPort: 9443
              name: https
              protocol: TCP
          volumeMounts:
            - name: plugin-serving-cert
              mountPath: /var/serving-cert
              readOnly: true
      volumes:
        - name: plugin-serving-cert
          secret:
            secretName: kube-doctor-console-plugin-cert
            defaultMode: 420
---
apiVersion: v1
kind: Service
metadata:
  name: kube-doctor-console-plugin
  namespace: kube-doctor-system
  annotations:
    service.alpha.openshift.io/serving-cert-secret-name: kube-doctor-console-plugin-cert
spec:
  ports:
    - name: https
      port: 9443
      targetPort: https
      protocol: TCP
  selector:
    app: kube-doctor-console-plugin
---
apiVersion: console.openshift.io/v1
kind: ConsolePlugin
metadata:
  name: kube-doctor-console-plugin
spec:
  displayName: "Kube-Doctor Autonomous SRE & GitOps Remediation"
  backend:
    type: Service
    service:
      name: kube-doctor-console-plugin
      namespace: kube-doctor-system
      port: 9443
      basePath: /
  proxy:
    - alias: backend
      authorization: UserToken
      endpoint:
        type: Service
        service:
          name: kube-doctor
          namespace: kube-doctor-system
          port: 8080
