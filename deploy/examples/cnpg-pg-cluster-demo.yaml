apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusters.postgresql.cnpg.io
spec:
  group: postgresql.cnpg.io
  names:
    kind: Cluster
    listKind: ClusterList
    plural: clusters
    singular: cluster
    shortNames:
      - cnpg
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
          properties:
            spec:
              type: object
              properties:
                instances:
                  type: integer
                  description: Number of PostgreSQL instances in the cluster
                storage:
                  type: object
                  properties:
                    size:
                      type: string
                      description: PGDATA PersistentVolumeClaim storage size for each PostgreSQL instance
                walStorage:
                  type: object
                  properties:
                    size:
                      type: string
                      description: Dedicated Write-Ahead Log (WAL) PVC storage size
                resources:
                  type: object
                  description: Compute resources (requests/limits for memory and cpu) for PostgreSQL instance pods
                  properties:
                    limits:
                      type: object
                      properties:
                        memory:
                          type: string
                          description: Memory limit for PostgreSQL instance pods
                        cpu:
                          type: string
                    requests:
                      type: object
                      properties:
                        memory:
                          type: string
                          description: Memory request for PostgreSQL instance pods
                        cpu:
                          type: string
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-cluster
  namespace: default
  labels:
    app.kubernetes.io/name: cloudnative-pg
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2
  storage:
    size: 10Gi
  resources:
    requests:
      memory: 128Mi
      cpu: 250m
    limits:
      memory: 256Mi
      cpu: 1000m
status:
  phase: Failing
  currentPrimary: pg-cluster-1
  readyInstances: 1
  conditions:
    - type: Ready
      status: "False"
      reason: InstanceOOMKilled
      message: "PostgreSQL instance pod pg-cluster-1 terminated with OOMKilled (ExitCode 137) under 256Mi memory limit"
